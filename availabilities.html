 .list{overflow-y:auto;flex:1;padding:8px}
 .card{padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}

 .cowner{font-size:11px;color:#889;margin-top:3px}
 .card-links{display:flex;gap:12px;margin-top:7px}
 .card-links a{font-size:11.5px;text-decoration:none;color:#1d4ed8;font-weight:600}
 .card-links a:hover{text-decoration:underline}
 #map{flex:1;height:100vh;background:#222}
 .leaflet-popup-content{font-size:13px;line-height:1.5;min-width:210px}
 .pop-sub{font-size:10.5px;color:var(--accent);font-weight:700;text-transform:uppercase}
 .pop-t{font-weight:700;font-size:14px;margin:2px 0 6px}
 .pop-r{display:flex;justify-content:space-between;gap:14px;border-top:1px solid #eee;padding:3px 0}
 .pop-r span:first-child{color:#778}
 .pop-links{margin-top:8px;padding-top:6px;border-top:1px solid #eee}
 .pop-links a{font-size:12.5px;color:#1d4ed8;font-weight:600;text-decoration:none}
 @media(max-width:720px){.wrap{flex-direction:column}.side{width:100%;height:46vh}#map{height:54vh}}

const map=L.map('map',{scrollWheelZoom:true}).setView([33.75,-84.39],9);

const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'}).addTo(map);
const labels=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.9}).addTo(map);
L.control.layers({'Satellite':sat,'Street map':street},{'Place labels':labels},{position:'topright'}).addTo(map);

function mk(n,on){return L.divIcon({className:'',html:`<div style="background:${on?'#15803d':'#15803d'};color:#fff;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);border:2px solid #fff"><span style="transform:rotate(45deg);font-weight:700;font-size:10px">${n}</span></div>`,iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-24]});}
const markers={};
props.forEach(p=>{
  const m=L.marker([p.lat,p.lon],{icon:mk(p.n)});
  m.bindPopup(`<div class="pop-sub">${p.sub}</div><div class="pop-t">${p.addr}</div>
   <div class="pop-r"><span>Building size</span><b>${p.size}</b></div>
   <div class="pop-r"><span>Usable acreage</span><b>${p.acres} ac</b></div>
   <div class="pop-r"><span>Monthly rent</span><b>${p.rent}</b></div>
   <div class="pop-r"><span>Rent / ac / mo</span><b>${p.rentac}</b></div>
   <div class="pop-r"><span>Owner</span><b>${p.owner}</b></div>
   <div class="pop-links"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}" target="_blank">\u{1F4CD} Find exact address in Google Maps &rarr;</a></div>`);
  markers[p.n]=m; m.addTo(map);
});

const list=document.getElementById('list');
function render(filter){
  list.innerHTML='';
  props.filter(p=>!filter||p.sub===filter).forEach(p=>{
    const c=document.createElement('div');
    c.className='card'; c.dataset.n=p.n; c.onclick=()=>focus(p.n);
    c.innerHTML=`<div class="csub">${p.sub}</div><div class="caddr">${p.addr}</div>
      <div class="cmeta"><span>\u{1F3ED} ${p.size}</span><span>\u{1F4D0} ${p.acres} ac</span><span>\u{1F4B5} ${p.rent}/mo</span><span>${p.rentac}/ac</span></div>
      <div class="cowner">Owner: ${p.owner}</div>
      <div class="card-links"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}" target="_blank" onclick="event.stopPropagation()">\u{1F4CD} Google Maps</a></div>`;
    list.appendChild(c);
  });
}
function focus(n){const p=props.find(x=>x.n===n);if(!p)return;map.flyTo([p.lat,p.lon],14,{duration:.7});markers[n].openPopup();
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',+c.dataset.n===n));}

const sel=document.getElementById('subfilter');
submarkets.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
sel.onchange=()=>{const f=sel.value;render(f);
  Object.values(markers).forEach(m=>map.removeLayer(m));
  const grp=[];props.forEach(p=>{if(!f||p.sub===f){markers[p.n].addTo(map);grp.push(markers[p.n]);}});
  if(grp.length){const g=L.featureGroup(grp);map.fitBounds(g.getBounds().pad(0.2));}
};
render('');
const all=L.featureGroup(Object.values(markers));map.fitBounds(all.getBounds().pad(0.05));
